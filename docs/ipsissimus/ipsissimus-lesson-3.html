<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EsoTarot | VII-3: DIRECT PERCEPTION</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@200;300;400&family=JetBrains+Mono:wght@200;400&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            void: "#000000",
            panel: "#080808",
            platinum: "#e2e8f0",
            diamond: "#ffffff",
            subtle: "#333333",
            fire: "#ef4444",   /* Red for Fire/Wands */
            water: "#3b82f6",  /* Blue for Water/Cups */
            air: "#fcd34d",    /* Yellow for Air/Swords */
            earth: "#10b981",  /* Green for Earth/Disks */
          },
          fontFamily: {
            serif: ['"Cinzel"', 'serif'],
            sans: ['"Inter"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          animation: {
            'breathe': 'breathe 4s ease-in-out infinite',
            'reveal': 'reveal 1s ease-out forwards',
          },
          keyframes: {
            breathe: {
              '0%, 100%': { opacity: '0.05' },
              '50%': { opacity: '0.15' },
            },
            reveal: {
              '0%': { transform: 'rotateY(180deg)', opacity: '0' },
              '100%': { transform: 'rotateY(0)', opacity: '1' },
            }
          }
        }
      }
    };
  </script>

  <style>
    body { background-color: #000000; color: #e2e8f0; overflow-x: hidden; }
    
    /* The Null Grid */
    .bg-null-grid {
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* Sidebar Link */
    .sidebar-link { border-left: 1px solid transparent; opacity: 0.4; transition: all 0.5s; }
    .sidebar-link:hover { padding-left: 1.5rem; opacity: 1; border-color: #ffffff; }
    .sidebar-link.active { 
      border-color: #ffffff; 
      opacity: 1;
      background: linear-gradient(90deg, rgba(255,255,255,0.05) 0%, transparent 100%);
    }

    /* The Hidden Card */
    .card-back {
      background: #0a0a0a;
      border: 1px solid #333;
      background-image: radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 10px 10px;
      transition: all 0.5s ease;
      cursor: pointer;
    }
    .card-back:hover {
      border-color: #fff;
      transform: scale(1.02);
    }

    /* Elemental Ambience (The "Tell") */
    #ambience-layer {
      pointer-events: none;
      transition: background-color 2s ease;
    }
  </style>
</head>
<body class="bg-void bg-null-grid min-h-screen flex font-sans selection:bg-diamond selection:text-void">

  <aside class="w-72 border-r border-subtle/30 hidden md:flex flex-col z-50 bg-black/90 backdrop-blur-md h-screen fixed left-0 top-0">
    <div class="p-8 border-b border-subtle/30">
      <div class="flex items-center gap-3">
        <div class="w-6 h-6 rounded-full border border-diamond flex items-center justify-center">
          <div class="w-1 h-1 bg-diamond rounded-full"></div>
        </div>
        <span class="font-serif text-lg tracking-[0.2em] text-diamond">ESOTAROT</span>
      </div>
      <div class="mt-8">
        <span class="block text-[10px] font-mono text-subtle uppercase tracking-widest">Current Protocol</span>
        <span class="block text-xs font-mono text-platinum uppercase tracking-widest mt-1">7.3 DIRECT PERCEPTION</span>
      </div>
    </div>

    <nav class="flex-1 overflow-y-auto py-12 text-sm space-y-2">
      <a href="ipsissimus-intro.html" class="sidebar-link block px-6 py-2 font-sans font-light">
        <span class="font-mono text-[10px] mr-3">7.0</span> Intro: Silence
      </a>
      <a href="ipsissimus-lesson-1.html" class="sidebar-link block px-6 py-2 font-sans font-light">
        <span class="font-mono text-[10px] mr-3">7.1</span> The Abyss
      </a>
      <a href="ipsissimus-lesson-2.html" class="sidebar-link block px-6 py-2 font-sans font-light">
        <span class="font-mono text-[10px] mr-3">7.2</span> Anti-Teaching
      </a>
      <a href="#" class="sidebar-link active block px-6 py-2 font-sans font-light">
        <span class="font-mono text-[10px] mr-3">7.3</span> Direct Perception
      </a>
    </nav>
  </aside>

  <main class="flex-1 overflow-y-auto relative md:ml-72 flex flex-col h-screen">
    
    <div id="ambience-layer" class="absolute inset-0 z-0 opacity-10 animate-breathe"></div>

    <header class="px-8 py-12 border-b border-subtle/20 relative z-10 bg-black/50 backdrop-blur-sm">
      <div class="max-w-4xl mx-auto flex justify-between items-end">
        <div>
          <span class="font-mono text-[10px] tracking-[0.3em] text-subtle uppercase block mb-2">SENSORY DEPRIVATION</span>
          <h1 class="font-serif text-3xl text-diamond">The Empty Hand</h1>
        </div>
        <div class="text-right hidden md:block">
          <p class="text-xs text-subtle font-mono max-w-xs ml-auto">
            "The card is face down. The data is already in the room. Feel the temperature."
          </p>
        </div>
      </div>
    </header>

    <section class="flex-1 flex flex-col items-center justify-center relative z-10 px-8">
      
      <div id="card-container" class="w-48 h-72 perspective-1000 relative mb-16">
        <div id="card-inner" class="relative w-full h-full transition-transform duration-700 transform-style-3d">
          
          <div class="absolute w-full h-full backface-hidden bg-panel border border-subtle flex flex-col items-center justify-center rotate-y-180" style="transform: rotateY(180deg);">
            <div id="result-icon" class="text-4xl mb-4"></div>
            <h3 id="result-name" class="font-serif text-lg text-center px-4"></h3>
            <span id="result-element" class="font-mono text-[10px] mt-2 uppercase tracking-widest"></span>
          </div>

          <div class="absolute w-full h-full backface-hidden card-back flex items-center justify-center">
            <div class="w-8 h-8 border border-subtle rotate-45 flex items-center justify-center">
              <div class="w-4 h-4 bg-subtle/50 rotate-45"></div>
            </div>
          </div>

        </div>
      </div>

      <div id="guess-interface" class="w-full max-w-lg">
        <p class="text-center font-mono text-[10px] text-subtle uppercase tracking-widest mb-6">WHAT IS THE NATURE OF THE HIDDEN FORCE?</p>
        
        <div class="grid grid-cols-4 gap-4">
          <button onclick="makeGuess('fire')" class="py-4 border border-subtle/50 hover:border-fire hover:text-fire transition-colors text-xs font-mono group">
            <i class="fa-solid fa-fire mb-2 block text-subtle group-hover:text-fire"></i> FIRE
          </button>
          <button onclick="makeGuess('water')" class="py-4 border border-subtle/50 hover:border-water hover:text-water transition-colors text-xs font-mono group">
            <i class="fa-solid fa-droplet mb-2 block text-subtle group-hover:text-water"></i> WATER
          </button>
          <button onclick="makeGuess('air')" class="py-4 border border-subtle/50 hover:border-air hover:text-air transition-colors text-xs font-mono group">
            <i class="fa-solid fa-wind mb-2 block text-subtle group-hover:text-air"></i> AIR
          </button>
          <button onclick="makeGuess('earth')" class="py-4 border border-subtle/50 hover:border-earth hover:text-earth transition-colors text-xs font-mono group">
            <i class="fa-solid fa-square mb-2 block text-subtle group-hover:text-earth"></i> EARTH
          </button>
        </div>

        <div id="feedback" class="h-12 mt-8 text-center flex items-center justify-center font-mono text-xs opacity-0 transition-opacity">
          </div>

        <button id="reset-btn" onclick="initRound()" class="w-full py-3 mt-4 border border-diamond text-diamond font-mono text-[10px] uppercase tracking-widest hidden hover:bg-diamond hover:text-black transition-colors">
          DRAW AGAIN
        </button>
      </div>

    </section>

  </main>

  <script>
    /**
     * LOGIC:
     * 1. A random element is chosen.
     * 2. The #ambience-layer background color changes VERY subtly to match.
     * 3. User guesses based on the "vibe" (color tint).
     */
    
    const elements = {
      'fire': { color: '#ef4444', icon: 'fa-fire', name: 'ACE OF WANDS', label: 'PURE WILL' },
      'water': { color: '#3b82f6', icon: 'fa-droplet', name: 'ACE OF CUPS', label: 'PURE EMOTION' },
      'air': { color: '#fcd34d', icon: 'fa-wind', name: 'ACE OF SWORDS', label: 'PURE INTELLECT' },
      'earth': { color: '#10b981', icon: 'fa-square', name: 'ACE OF DISKS', label: 'PURE MATTER' }
    };

    let currentElement = null;
    const ambience = document.getElementById('ambience-layer');
    const cardInner = document.getElementById('card-inner');
    const feedback = document.getElementById('feedback');
    const resultIcon = document.getElementById('result-icon');
    const resultName = document.getElementById('result-name');
    const resultLabel = document.getElementById('result-element');
    const resetBtn = document.getElementById('reset-btn');
    const guessButtons = document.querySelectorAll('#guess-interface button:not(#reset-btn)');

    function initRound() {
      // Reset UI
      cardInner.style.transform = 'rotateY(0deg)';
      feedback.style.opacity = '0';
      resetBtn.classList.add('hidden');
      guessButtons.forEach(btn => {
        btn.disabled = false;
        btn.style.opacity = '1';
      });

      // Pick Random Element
      const keys = Object.keys(elements);
      const randomKey = keys[Math.floor(Math.random() * keys.length)];
      currentElement = elements[randomKey];

      // Set Ambience (The Hint)
      // Note: Low opacity in CSS makes this subtle.
      ambience.style.backgroundColor = currentElement.color;

      console.log("Debug: Hidden element is " + randomKey); 
    }

    function makeGuess(guess) {
      // Reveal Card
      const target = elements[guess];
      const isCorrect = elements[guess] === currentElement;

      // Populate Card Face
      resultIcon.innerHTML = `<i class="fa-solid ${currentElement.icon}" style="color: ${currentElement.color}"></i>`;
      resultName.innerText = currentElement.name;
      resultLabel.innerText = currentElement.label;
      resultLabel.style.color = currentElement.color;

      // Flip Animation
      cardInner.style.transform = 'rotateY(180deg)';

      // Feedback
      feedback.style.opacity = '1';
      if (isCorrect) {
        feedback.innerHTML = `<span class="text-white">PERCEPTION ACCURATE. THE SIGNAL WAS RECEIVED.</span>`;
      } else {
        feedback.innerHTML = `<span class="text-subtle">DISTORTION DETECTED. TUNE THE RECEIVER.</span>`;
      }

      // Disable buttons
      guessButtons.forEach(btn => {
        btn.disabled = true;
        btn.style.opacity = '0.3';
      });

      resetBtn.classList.remove('hidden');
    }

    // Start
    initRound();
  </script>
</body>
</html>
